# ModelRepoFinder v1.7
# These are the computers the app can plan for. "This computer (detected)"
# is filled in automatically each time the app starts: it reads this
# computer's memory and graphics card (nothing is sent anywhere) and
# suggests a size limit. You can change that limit in the app, or pick one
# of the example presets below instead. Rename presets, change their size
# caps, or add your own entries. Set enabled: false to hide a preset from
# the computer list. Caps are in gigabytes and should usually sit a little
# under the memory you can spare.
config_version: '1.7'

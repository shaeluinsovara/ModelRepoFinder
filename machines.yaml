tags:
  coding:
    name: Coding
    description: Models that help with writing and reading code.
    hf_search: coder
    hf_queries:
    - coder
    - coding
    pipeline_tag: text-generation
    use_pipeline_tag: false
    keep: 2
    exclude_id_substrings:
    - music
    - tts
    - whisper
    - embedding
    - mmproj
  relational:
    name: Emotional / relational chat
    description: Roleplay, companion, empathetic, creative writing, and uncensored
      conversation.
    hf_search: roleplay
    hf_queries:
    - roleplay
    - companion
    - creative writing
    - uncensored
    keywords:
    - roleplay
    - role-play
    - companion
    - empath
    - uncensored
    - creative writing
    - character
    - conversational
    - persona
    fuzzy_card: true
    keep: 2
    exclude_id_substrings:
    - music
    - tts
    - whisper
    - embedding
    - mmproj
  spiritual:
    name: Spiritual / esoteric knowledge
    description: Philosophy, theology, esoteric study, and meditation. Search is fuzzy
      and also looks at model-card words and tags.
    hf_search: philosophy
    hf_queries:
    - philosophy
    - spiritual
    - theology
    - meditation
    - esoteric
    keywords:
    - philosophy
    - philosophical
    - theology
    - theological
    - esoteric
    - meditation
    - spiritual
    - spirituality
    - mysticism
    - mystical
    - contemplative
    - wisdom
    - stoic
    - stoicism
    - dharma
    - scripture
    fuzzy_card: true
    keep: 2
    exclude_id_substrings:
    - music
    - tts
    - whisper
    - embedding
    - mmproj
  vision:
    name: Vision (image and video)
    description: Image and video understanding, including VL and video-LLM models.
    hf_search: VL
    hf_queries:
    - VL
    - video-llm
    - video language
    keywords:
    - vl
    - vision
    - video
    - image-text
    - video-llm
    - multimodal
    keep: 2
    exclude_id_substrings:
    - music
    - tts
    - whisper
    - embedding
  music:
    name: Music creation (with voice cloning)
    description: Music generators and voice-conversion models such as ACE-Step, YuE,
      MusicGen, and RVC. These are often not GGUF.
    hf_search: MusicGen
    hf_queries:
    - ACE-Step
    - YuE
    - MusicGen
    - RVC
    - so-vits
    - voice conversion
    keywords:
    - music
    - ace-step
    - acestep
    - yue
    - musicgen
    - rvc
    - so-vits
    - sovits
    - voice conversion
    - singing
    - text-to-music
    - text-to-audio
    allow_nongguf: true
    fuzzy_card: true
    keep: 2
    exclude_id_substrings:
    - embedding
    - mmproj
  speech:
    name: Speech / TTS
    description: Text-to-speech and speech-to-text (including Whisper).
    hf_search: TTS
    hf_queries:
    - TTS
    - whisper
    - text-to-speech
    - speech-to-text
    keywords:
    - tts
    - whisper
    - asr
    - stt
    - text-to-speech
    - speech-to-text
    - piper
    - kokoro
    - xtts
    allow_nongguf: true
    fuzzy_card: true
    keep: 2
    exclude_id_substrings:
    - musicgen
    - ace-step
    - embedding
    - mmproj
  background:
    name: Background / reasoning
    description: Smaller "thinking" models meant to stay running in the background.
    hf_search: thinking
    hf_queries:
    - thinking
    - reasoning
    - r1 distill
    keywords:
    - thinking
    - reasoning
    - chain-of-thought
    - distill
    - r1
    cap_gb: 8
    keep: 2
    exclude_id_substrings:
    - music
    - tts
    - whisper
    - embedding
    - mmproj
    - -VL-
    - VL-
    - vision
    - video
  embedding:
    name: Embedding
    description: Models that turn text into embeddings for search and memory.
    hf_search: embedding
    hf_queries:
    - embedding
    pipeline_tag: feature-extraction
    use_pipeline_tag: false
    keep: 1
    exclude_id_substrings:
    - music
    - tts
    - whisper
    - -VL-
    - coder
  science:
    name: Science / Research / Academia
    description: Models for research papers, math, biology, chemistry, physics, medicine,
      and data science, including scientific chat models.
    hf_search: science
    hf_queries:
    - science
    - math
    - biology
    - chemistry
    - medical
    keywords:
    - science
    - scientific
    - research
    - academic
    - arxiv
    - pubmed
    - paper
    - math
    - theorem
    - prover
    - biology
    - biomed
    - bioinformatic
    - protein
    - genom
    - chemistry
    - chemllm
    - molecul
    - physics
    - astronom
    - medical
    - clinical
    - statistic
    - data science
    - data-science
    fuzzy_card: true
    keep: 2
    exclude_id_substrings:
    - music
    - tts
    - whisper
    - embedding
    - mmproj
github_tags:
  runners:
    name: Local AI runners / frontends
    description: Apps for running and chatting with local models (Ollama, LM Studio
      frontends, WebUIs, and similar).
    queries:
    - ollama OR "lm studio" OR koboldcpp OR "text-generation-webui" OR "open-webui"
      OR "llama.cpp"
    keep: 5
  memory_agents:
    name: AI memory / agents
    description: Agent frameworks and long-term memory / RAG tools for AI persons.
    queries:
    - '"ai agent" OR "llm agent" OR "autogen" OR "memgpt" OR "letta" OR "rag memory"
      OR langchain'
    keep: 5
  voice:
    name: Voice / TTS
    description: Speech, voice cloning, and text-to-speech projects.
    queries:
    - TTS OR "text-to-speech" OR whisper OR piper OR kokoro OR "voice cloning"
    keep: 5
  music:
    name: Music
    description: Music generation and voice-conversion projects.
    queries:
    - '"music generation" OR musicgen OR "ace-step" OR YuE OR RVC OR "so-vits" OR
      "text-to-music"'
    keep: 5
  vision:
    name: Vision
    description: Image and video understanding, and local vision toolkits.
    queries:
    - '"vision llm" OR "video llm" OR moondream OR "open-vision" OR "image understanding"
      OR comfyui'
    keep: 5
  home_automation:
    name: Home automation / robotics / sensors
    description: Home Assistant, robotics, and sensor projects that could later hook
      into the house.
    queries:
    - '"home assistant" OR robotics OR "robot arm" OR "iot sensors" OR "home automation"'
    keep: 5
  coding_tools:
    name: Coding tools
    description: Local coding assistants, linters, and developer tools.
    queries:
    - '"coding assistant" OR "continue dev" OR "tabby" OR "open interpreter" OR "aider"
      OR "local copilot"'
    keep: 5
  science:
    name: Science / Research / Academia
    description: Research and academic tools such as paper readers, math and statistics
      libraries, bioinformatics, chemistry, physics, and data science projects.
    queries:
    - '"scientific computing" OR bioinformatics OR "computational chemistry" OR "research
      papers" OR arxiv OR "data science"'
    keep: 5
custom_tags: {}
github_custom_tags: {}
taste_tags_later:
- relational_expression
- philosophical_spiritual
paths:
  base: ''
  incoming: incoming
  retired: retired
  report: report.md
allow_list: []
github_allow_list: []
keep_retired: true
